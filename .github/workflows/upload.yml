name: Upload Website

on:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Website
        uses: actions/upload-artifact@v7
        with:
          name: my-website
          path: |
            index.html
            *.css
            *.js
          if-no-files-found: error
          retention-days: 30
